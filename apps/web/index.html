<!doctype html>
<html lang="id" data-theme="light" data-text-size="normal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TokoJojo Admin — sistem administrasi bisnis dan inventaris."
    />
    <title>TokoJojo Admin</title>
    <script>
      (() => {
        try {
          const stored = JSON.parse(
            localStorage.getItem("tokojojo.preferences") || "{}",
          );
          const dark =
            stored.theme === "dark" ||
            (stored.theme !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.textSize =
            stored.textSize === "large" ? "large" : "normal";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
