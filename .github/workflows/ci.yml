name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".github/CODEOWNERS"
      - ".github/actionlint.yaml"
      - "compose.dev.yaml"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web || steps.force.outputs.web }}
      rust: ${{ steps.filter.outputs.rust || steps.force.outputs.rust }}
      android: ${{ steps.filter.outputs.android || steps.force.outputs.android }}
      api: ${{ steps.filter.outputs.api || steps.force.outputs.api }}
      graphql: ${{ steps.filter.outputs.graphql || steps.force.outputs.graphql }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/pos/src/**'
              - 'apps/pos/index.html'
              - 'apps/pos/package.json'
              - 'apps/pos/vite.config.ts'
              - 'apps/pos/tsconfig*.json'
              - 'apps/pos/public/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.mjs'
              - 'commitlint.config.cjs'
              - '.prettierrc'
              - '.prettierignore'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
              - '!**/.gitignore'
              - '!**/.gitattributes'
            rust:
              - 'apps/pos/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
            android:
              - 'apps/android/**'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.mjs'
              - 'commitlint.config.cjs'
              - '.prettierrc'
              - '.prettierignore'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
            graphql:
              - 'packages/graphql/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!LICENSE'
      - name: Force all jobs on main/manual
        id: force
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "web=true"
            echo "rust=true"
            echo "android=true"
            echo "api=true"
            echo "graphql=true"
          } >> "$GITHUB_OUTPUT"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @tokojojo/web build
      - run: pnpm --filter @tokojojo/pos build

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check --workspace

  android:
    name: android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug --no-daemon

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tokojojo
          POSTGRES_USER: tokojojo
          POSTGRES_PASSWORD: tokojojo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokojojo -d tokojojo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://tokojojo:tokojojo_dev@127.0.0.1:5432/tokojojo
      PASSWORD_PEPPER: ci-development-pepper-not-for-production
      PASSWORD_PEPPER_VERSION: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tokojojo/api db:docs:check
      - run: pnpm --filter @tokojojo/api typecheck
      - run: pnpm --filter @tokojojo/api lint
      - run: pnpm exec prettier --check apps/api
      - run: pnpm --filter @tokojojo/api db:check
      - name: Contract gate (Pothos printSchema)
        run: pnpm --filter @tokojojo/api schema:check
      - run: pnpm --filter @tokojojo/api db:migrate
      - run: pnpm --filter @tokojojo/api db:seed
      - run: pnpm --filter @tokojojo/api db:seed
      - run: pnpm --filter @tokojojo/api test

  graphql:
    name: graphql
    needs: changes
    if: needs.changes.outputs.graphql == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract gate (Pothos printSchema)
        run: pnpm --filter @tokojojo/api schema:check
      - run: pnpm --filter @tokojojo/graphql check

  ci-gate:
    name: ci-gate
    needs: [changes, web, rust, android, api, graphql]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        run: |
          echo "changes=${{ needs.changes.result }}"
          echo "web=${{ needs.web.result }}"
          echo "rust=${{ needs.rust.result }}"
          echo "android=${{ needs.android.result }}"
          echo "api=${{ needs.api.result }}"
          echo "graphql=${{ needs.graphql.result }}"
          for result in \
            "${{ needs.changes.result }}" \
            "${{ needs.web.result }}" \
            "${{ needs.rust.result }}" \
            "${{ needs.android.result }}" \
            "${{ needs.api.result }}" \
            "${{ needs.graphql.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
